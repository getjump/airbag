name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/airbag" ./cmd/airbag
          sudo install -m 755 "$RUNNER_TEMP/airbag" /usr/local/bin/airbag
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/airbag
      - name: end-to-end tests
        # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor;
        # airbag doctor prints the profile a user would install, CI lifts it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 666 /dev/fuse || true
          sudo mkdir -m 1777 -p /var/lib/airbag-e2e
          airbag doctor
          for t in test/e2e.sh test/*-e2e.sh; do echo "== $t"; sh "$t"; done
          python3 test/ctrlc.py
      - name: runtime policy build cost (diagnostic)
        run: sh test/runtime-policy-bench.sh

  runtime-build-bench:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        parallelism: [1, 2]
    env:
      BENCH_BEFORE_SHA: 182ddaf0c4f8849aa7d314674a5a473c795396a4
      BENCH_SOURCE_SHA: 543fe189b85a0e85870ee9d92244eb2d89385280
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build paired binaries and fixed source snapshot
        run: |
          mkdir "$RUNNER_TEMP/airbag-bench-source"
          git archive "$BENCH_SOURCE_SHA" | tar -x -C "$RUNNER_TEMP/airbag-bench-source"
          mkdir "$RUNNER_TEMP/airbag-bench-before"
          git archive "$BENCH_BEFORE_SHA" | tar -x -C "$RUNNER_TEMP/airbag-bench-before"
          (cd "$RUNNER_TEMP/airbag-bench-before" && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/airbag-before" ./cmd/airbag)
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/airbag-after" ./cmd/airbag
          CGO_ENABLED=0 go build -tags=airbag_bench -o "$RUNNER_TEMP/airbag-diagnostic" ./cmd/airbag
          sudo install -m 755 "$RUNNER_TEMP/airbag-after" /usr/local/bin/airbag
          go mod download
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 666 /dev/fuse
      - name: cold, unchanged, and incremental builds (paired)
        run: |
          diagnostic=()
          if [ '${{ matrix.parallelism }}' = 2 ]; then
            diagnostic=(--diagnostic "$RUNNER_TEMP/airbag-diagnostic")
          fi
          python3 test/runtime-build-bench.py "${diagnostic[@]}" \
            --before "$RUNNER_TEMP/airbag-before" --after "$RUNNER_TEMP/airbag-after" \
            --source "$RUNNER_TEMP/airbag-bench-source" \
            --parallelism ${{ matrix.parallelism }} --trials 2 \
            --output "$RUNNER_TEMP/build-bench-p${{ matrix.parallelism }}.jsonl"
      - name: audit storage benchmarks (same runner)
        if: matrix.parallelism == 2
        run: |
          CGO_ENABLED=0 go test ./internal/effects -run '^$' -bench '^BenchmarkAuditStorage$' \
            -benchtime=8192x -count=3 -timeout=10m \
            | tee "$RUNNER_TEMP/audit-storage-bench.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-build-p${{ matrix.parallelism }}
          path: |
            ${{ runner.temp }}/build-bench-p${{ matrix.parallelism }}.jsonl
            ${{ runner.temp }}/audit-storage-bench.txt
