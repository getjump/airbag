name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories show up with no change to the code.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/airbag" ./cmd/airbag
          sudo install -m 755 "$RUNNER_TEMP/airbag" /usr/local/bin/airbag
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/airbag
      - name: end-to-end tests
        # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor;
        # airbag doctor prints the profile a user would install, CI lifts it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 666 /dev/fuse || true
          sudo mkdir -m 1777 -p /var/lib/airbag-e2e
          airbag doctor
          for t in test/e2e.sh test/*-e2e.sh; do echo "== $t"; sh "$t"; done
          python3 test/ctrlc.py

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt, go mod tidy and verify, go vet
        run: sh test/check.sh hygiene
      - name: golangci-lint
        run: sh test/check.sh lint

  vuln:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: govulncheck
        run: sh test/check.sh vuln
