name: release
on:
  push:
    tags: ["v*"]

permissions: {}

# A v* tag on main becomes a release: GoReleaser builds, signs and
# uploads it as a draft (.goreleaser.yaml), it is attested and then
# published, and from then on it is immutable. verify then checks the
# published release as a user would (docs/verify.md).
jobs:
  release:
    runs-on: ubuntu-24.04
    # The owner must create the "release" environment before the first
    # tag (Settings > Environments): themselves as required reviewer, and
    # deployment tags limited to v*. A job that names an environment that
    # does not exist yet creates it with no protection at all.
    # Immutable releases are a setting of their own (Settings > General >
    # Releases), which this job's token cannot read: the endpoint needs
    # admin read. The environment holds RELEASE_SETTINGS_TOKEN, a
    # fine-grained token for this repository with Administration:
    # read-only and nothing else, used only to read that setting.
    environment: release
    permissions:
      contents: write # create the draft release, upload its assets, publish it
      id-token: write # Sigstore keyless signing, by cosign and actions/attest
      attestations: write # store the build provenance
    steps:
      # Publishing the draft does not make it immutable; the setting does.
      # It is read now, before anything is built, so no mutable release
      # goes out; verify checks the published release itself.
      - name: immutable releases are on
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$GH_TOKEN" ] || {
            echo "::error::add RELEASE_SETTINGS_TOKEN to the release environment: a fine-grained token for this repository with Administration: read-only"
            exit 1
          }
          # 404 when the setting is off.
          enabled=$(gh api "repos/$REPO/immutable-releases" --jq .enabled) || enabled=
          [ "$enabled" = true ] || {
            echo "::error::immutable releases are off for $REPO (or the token cannot read the setting); turn them on (Settings > General > Releases) and run the release again"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history and origin/main: the tag must be on main, and
          # GoReleaser looks for the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main; release notes from CHANGELOG.md
        env:
          REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          case $tag in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::$tag is not a version tag such as v0.1.0 or v0.1.0-rc.1"; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$tag is not on main"; exit 1; }
          # vX.Y.Z takes the notes of ## [X.Y.Z], a pre-release those of
          # ## [Unreleased].
          v=${tag#v}
          section=$v
          case $v in *-*) section=Unreleased ;; esac
          notes=$RUNNER_TEMP/notes.md
          awk -v h="## [$section]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md |
            sed '/^\[[^]]*\]: /d' > "$notes"
          grep -q '[^[:space:]]' "$notes" ||
            { echo "::error::CHANGELOG.md has no ## [$section] section"; exit 1; }
          printf '\n---\n\nHow to verify this release: [docs/verify.md](https://github.com/%s/blob/%s/docs/verify.md)\n' \
            "$REPO" "$tag" >> "$notes"
          case $v in
          *-*) ;;
          *) grep -q "version = \"$v\";" flake.nix ||
            echo "::warning::flake.nix does not say version = \"$v\"; the Nix build of this tag reports another version" ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Nothing another run wrote goes into a release.
          cache: false
      # cosign signs checksums.txt; syft writes the SBOMs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # With cosign on the PATH, the action checks the GoReleaser it
          # downloads against GoReleaser's signed checksums. The version is
          # updated by hand, like the tools in test/check.sh.
          version: v2.18.2
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # One attestation for every file checksums.txt lists: the
          # archives, their SBOMs and install.sh.
          subject-checksums: dist/checksums.txt
      - name: publish the draft; the release is immutable from here on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # What a user would run, against what was published. A failure means
  # the release is bad, and it cannot be changed: mark it [YANKED] in
  # CHANGELOG.md, retract it in go.mod and tag the next patch.
  verify:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the release and download its assets
      attestations: read # gh attestation verify
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release is immutable, with GitHub's attestation of its assets.
          n=0
          until gh release verify "$TAG" --repo "$REPO"; do
            n=$((n + 1))
            [ "$n" -lt 5 ] || exit 1
            sleep 15
          done
          mkdir "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$TAG" --repo "$REPO"
          # Every asset checksums.txt lists is there and matches, and this
          # workflow signed checksums.txt at this tag.
          sha256sum --check --strict checksums.txt
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          for f in airbag_*.tar.gz install.sh; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
            gh release verify-asset "$TAG" "$f" --repo "$REPO"
          done
          # The installer as a user runs it, with cosign required. In a
          # fork (a rehearsal) the copy fetches from the fork.
          sed "s|^repo=getjump/airbag\$|repo=$REPO|" install.sh > "$RUNNER_TEMP/install.sh"
          AIRBAG_VERSION=$TAG AIRBAG_VERIFY=require AIRBAG_BIN=$RUNNER_TEMP/bin sh "$RUNNER_TEMP/install.sh"
          got=$("$RUNNER_TEMP/bin/airbag" version)
          [ "$got" = "airbag $TAG" ] || { echo "::error::airbag version says $got"; exit 1; }
