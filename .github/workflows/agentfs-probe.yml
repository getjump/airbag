name: AgentFS filesystem compatibility
on:
  pull_request:
    paths:
      - 'test/agentfs-probe.py'
      - '.github/workflows/agentfs-probe.yml'
      - 'docs/filesystem-backends.md'
  workflow_dispatch:

permissions: {}
concurrency:
  group: agentfs-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  airbag-mac:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build real Airbag and test the same Mac filesystem workload
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/airbag-native" ./cmd/airbag
          python3 test/agentfs-probe.py --airbag "$RUNNER_TEMP/airbag-native" --output airbag-mac-results
      - name: preserve Airbag baseline including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airbag-native-macos
          path: airbag-mac-results/
          if-no-files-found: error
  mounted:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            sha256: ba314bd58262ca355e16afc3ecf405cfd934995b15af231d32a0426b72d74700
          - runner: macos-15
            target: aarch64-apple-darwin
            sha256: d07772d7c96f16c0d8996c15502f189d449ab0d9460fc2fe68f6edbae91bae73
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux FUSE prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo chmod 666 /dev/fuse
      - name: pinned AgentFS release
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          curl -fSL --retry 3 -o agentfs.tar.xz \
            "https://github.com/tursodatabase/agentfs/releases/download/v0.6.4/agentfs-$TARGET.tar.xz"
          echo "$EXPECTED_SHA256  agentfs.tar.xz" | shasum -a 256 -c -
          tar -xJf agentfs.tar.xz
      - name: actual mounted COW and POSIX operations
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 test/agentfs-probe.py --agentfs "agentfs-$TARGET/agentfs" --output agentfs-results
      - name: preserve mount failures and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentfs-${{ matrix.target }}
          path: agentfs-results/
          if-no-files-found: error
