name: scorecard
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so checks that depend on time or settings stay current.
    - cron: "17 3 * * 6"

permissions: {}

# OpenSSF Scorecard (https://scorecard.dev): results go to code scanning
# and, published, to the public API and the badge. A workflow that
# publishes may not set env or defaults or grant write access at the
# top, and this job may only use the actions below; the API refuses
# results from any other workflow.
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: prove the results came from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
