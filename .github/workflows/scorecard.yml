name: scorecard
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so checks that depend on time or settings stay current.
    - cron: "17 3 * * 6"

permissions: {}

# OpenSSF Scorecard (https://scorecard.dev): results go to code scanning
# and, published, to the public API and the badge. A workflow that
# publishes may not set env or defaults or grant write access at the
# top, and this job may only use the actions below; the API refuses
# results from any other workflow.
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: prove the results came from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
